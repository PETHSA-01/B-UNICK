<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B-unick</title>
    <script>
      // Aplica el tema guardado antes de que React pinte (evita el flash claro/oscuro).
      (function () {
        try {
          var t = localStorage.getItem('b-unick:tema')
          if (t === 'oscuro') {
            document.documentElement.setAttribute('data-theme', 'dark')
          } else if (t !== 'claro' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
